name: Validate enterprise product UX skill

on:
  pull_request:
    paths:
      - 'skills/enterprise-product-ux/**'
      - '.github/workflows/validate-enterprise-product-ux.yml'
  push:
    branches: [main]
    paths:
      - 'skills/enterprise-product-ux/**'
      - '.github/workflows/validate-enterprise-product-ux.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run skill contract tests
        run: python3 -m unittest discover -s skills/enterprise-product-ux/tests -v
