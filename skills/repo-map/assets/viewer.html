<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repository Map</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;color:#17273c;background:#f5f7fb}header{min-height:86px;background:#fff;border-bottom:1px solid #dde4ee;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 26px}h1{font-size:22px;margin:0 0 5px}small,.muted{color:#64748b}main{display:grid;grid-template-columns:260px 1fr 350px;height:calc(100vh - 130px);min-height:550px}aside{background:#fff;padding:20px;overflow:auto;border-right:1px solid #dde4ee}#detail{border-left:1px solid #dde4ee;border-right:0}input,select,button{font:inherit;border:1px solid #cdd7e5;border-radius:7px;background:#fff;padding:9px;color:inherit}input,select{width:100%;margin:6px 0 14px}button{cursor:pointer}button:hover{background:#eef4ff;border-color:#3977ed}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #90b8ff}label{font-size:12px;font-weight:600}#canvas{position:relative;overflow:hidden;background-image:radial-gradient(#dbe2ed 1px,transparent 1px);background-size:20px 20px}#graph{position:absolute;inset:0}h2{font-size:18px;overflow-wrap:anywhere}h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#64748b;margin-top:25px}p{line-height:1.6;overflow-wrap:anywhere}.badge{display:inline-block;border-radius:5px;background:#edf3ff;padding:4px 7px;font-size:11px;margin:3px}.finding{border-left:3px solid #ed475d;background:#fff3f4;padding:10px;margin:10px 0}.link{display:block;text-align:left;width:100%;margin:5px 0;font-size:12px;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f6fa;padding:12px;font-size:12px}#toolbar{position:absolute;right:14px;top:14px;display:flex;gap:5px}#hint{position:absolute;left:16px;bottom:14px;right:16px;color:#64748b;background:#f5f7fbee;padding:8px;font-size:12px;pointer-events:none}footer{min-height:44px;padding:10px 24px;background:#fff;border-top:1px solid #dde4ee;font-size:12px;color:#64748b}#tooltip{position:fixed;display:none;background:#17273c;color:white;border-radius:7px;padding:12px;max-width:350px;pointer-events:none;z-index:10;white-space:pre-line;font-size:12px}#status,#comparison{font-size:12px;margin:16px 0;line-height:1.6}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}a{color:#2364cc}details{margin-top:16px}.empty{color:#64748b;padding:15px}@media(max-width:1100px){main{grid-template-columns:210px 1fr;grid-template-rows:550px 320px;height:auto}#detail{grid-column:1/-1;border-top:1px solid #dde4ee}#summary{font-size:11px}}@media(max-width:600px){header{padding:12px}main{grid-template-columns:150px 1fr}aside{padding:12px}#toolbar{flex-wrap:wrap;max-width:160px}#toolbar button{padding:6px}}
</style>
<header><div><h1>Repository Map</h1><small id="subtitle"></small></div><div id="summary"></div></header>
<main><aside><label for="search">FIND CODE</label><input id="search" placeholder="Function, endpoint, file…"><label for="mode">EXPLORE</label><select id="mode"><option value="overview">Module overview</option><option value="neighbours">Selected node + neighbours</option><option value="upstream">What depends on this?</option><option value="downstream">What does this depend on?</option><option value="security">Security findings</option><option value="impact">Git change impact</option></select><label for="hops">RELATIONSHIP DEPTH</label><select id="hops"><option>1</option><option selected>2</option><option>3</option><option>4</option></select><button id="reset">Reset view</button><div id="comparison"></div><div id="results" aria-live="polite"></div><h3>Node types</h3><div id="legend"></div><div id="status"></div><details><summary>Analysis notes</summary><div id="warnings"></div></details></aside>
<section id="canvas" aria-label="Interactive repository graph"><div id="graph" role="img" aria-label="Code relationships. Use the node list to navigate with a keyboard."></div><div id="toolbar"><button id="minus" aria-label="Zoom out">−</button><button id="plus" aria-label="Zoom in">+</button><button id="fit">Fit</button><button id="layout">Arrange</button></div><div id="hint"></div></section>
<aside id="detail"><h2>Explore your repository</h2><p>Select a module to inspect symbols and relationships.</p><p>Expand modules and classes to explore their contents. Security badges show imported findings.</p></aside></main><footer id="footer"></footer><div id="tooltip"></div>
<script>/*CYTOSCAPE*/</script><script>
'use strict';const graph=/*GRAPH_DATA*/;
const $=id=>document.getElementById(id), byId=new Map(graph.nodes.map(n=>[n.id,n])), expanded=new Set(), positions=new Map();
const colors={module:'#3779e8',class:'#8956d8',function:'#159d91',method:'#159d91',endpoint:'#d28b1e',external:'#8794a8'};
let selected=null;
const el=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;};
const headless=!!globalThis.__REPO_MAP_HEADLESS__;
const cy=cytoscape({container:headless?undefined:$('graph'),headless,styleEnabled:!headless,elements:[],wheelSensitivity:.2,minZoom:.1,maxZoom:3,style:[
 {selector:'node',style:{label:'data(label)',shape:'round-rectangle','background-color':'#fff','border-width':1.5,'border-color':'data(color)',color:'#24344d','font-size':11,'text-valign':'center',width:170,height:45,'text-wrap':'ellipsis','text-max-width':150}},
 {selector:':parent',style:{'background-color':'#eaf0f8','background-opacity':.45,'border-color':'#a7b8d0','text-valign':'top','text-halign':'center',padding:24}},
 {selector:'edge',style:{width:1.5,'line-color':'#a8b7cc','target-arrow-color':'#a8b7cc','target-arrow-shape':'triangle','curve-style':'bezier',label:'data(type)','font-size':8,'text-background-color':'#f5f7fb','text-background-opacity':.8,'text-background-padding':2}},
 {selector:'edge[confidence = "inferred"]',style:{'line-style':'dashed'}},
 {selector:'node[hasFinding = 1]',style:{'border-color':'#ed475d','border-width':3}},
 {selector:'node[change = "added"]',style:{'background-color':'#e1f7ed','border-color':'#16835c'}},
 {selector:'node[change = "modified"]',style:{'background-color':'#fff3d5','border-color':'#d18d13'}},
 {selector:'node[change = "removed"]',style:{'background-color':'#ffe7e9','border-color':'#d95065','border-style':'dashed'}},
 {selector:'edge[change = "removed"]',style:{'line-color':'#d95065','target-arrow-color':'#d95065','line-style':'dashed'}},
 {selector:'node[affected = 1]',style:{'underlay-color':'#f2ca67','underlay-opacity':.2,'underlay-padding':5}},
 {selector:'.faded',style:{opacity:.2}},
 {selector:'.focused',style:{'border-width':4,'border-color':'#165ee2'}},
 {selector:'edge.highlight',style:{width:3,'line-color':'#3479ed','target-arrow-color':'#3479ed'}}
]});
$('subtitle').textContent=graph.meta.name+' · '+(graph.meta.commit?.slice(0,8)||'unversioned')+(graph.meta.dirty?' · working tree modified':'');
$('summary').textContent=`${graph.meta.files} files · ${graph.nodes.length} nodes · ${graph.edges.length} relationships`;
$('footer').textContent='Snapshot '+new Date(graph.meta.generatedAt).toLocaleString()+' · Dashed = inferred or removed · Re-run after code changes';
$('status').textContent=`${graph.meta.unresolvedCalls} unresolved calls omitted. ${graph.meta.findingsImported} imported findings; ${graph.meta.findingsUnmatched} unmatched.`;
for(const warning of graph.meta.warnings)$('warnings').append(el('p',warning));
for(const[k,v]of Object.entries(colors)){const p=el('p'),dot=el('span',undefined,'dot');dot.style.background=v;p.append(dot,document.createTextNode(k));$('legend').append(p);}
if(graph.comparison){const s=graph.comparison.summary;$('comparison').textContent=`Base ${graph.comparison.base.slice(0,8)} → working tree. ${s.added} added · ${s.modified} modified · ${s.removed} removed · ${s.affected} potentially affected. Green: added; amber: modified/affected; red: removed.`;}else{$('mode').querySelector('[value="impact"]').disabled=true;$('comparison').textContent='Add --base main (or a commit) when generating the report to enable change impact.';}
function collect(start,direction,depth){const found=new Set(start);let frontier=new Set(start);for(let i=0;i<depth;i++){const next=new Set();for(const e of graph.edges){if(['contains','imports'].includes(e.type))continue;const candidates=[];if(direction!=='upstream'&&frontier.has(e.source))candidates.push(e.target);if(direction!=='downstream'&&frontier.has(e.target))candidates.push(e.source);for(const id of candidates)if(!found.has(id)){found.add(id);next.add(id);}}frontier=next;}return found;}
function ancestors(ids){const result=new Set(ids);for(const id of ids){let p=byId.get(id)?.parent;while(p){result.add(p);p=byId.get(p)?.parent;}}return result;}
function choose(id,changeMode=true){selected=id;if(changeMode){$('search').value='';$('mode').value='neighbours';render();}details(byId.get(id));highlight();}
function highlight(){cy.elements().removeClass('faded focused highlight');if(!selected)return;const n=cy.getElementById(selected);if(n.empty())return;const neighbours=n.closedNeighborhood();const nearby=neighbours.union(neighbours.nodes().ancestors());cy.elements().difference(nearby).addClass('faded');n.addClass('focused');n.connectedEdges().addClass('highlight');}
function details(n){if(!n)return;const d=$('detail');d.replaceChildren(el('h2',n.label),el('span',n.kind,'badge'));for(const text of [n.framework,n.confidence,n.change,n.affected?'potentially affected':null])if(text)d.append(el('span',text,'badge'));
if(n.file){d.append(el('p',`${n.file}:${n.line}`));if(n.change==='removed')d.append(el('p','Removed node: source excerpt and location belong to the baseline revision.'));else{const a=el('a','Open source in VS Code');a.href='vscode://file'+(graph.meta.localRoot+'/'+n.file).split('/').map(encodeURIComponent).join('/')+':'+n.line;d.append(a);}const b=el('button','Copy source location');b.onclick=()=>navigator.clipboard?.writeText(n.file+':'+n.line).catch(()=>{});d.append(el('p'),b);}
if(n.excerpt||n.signature)d.append(el('pre',n.excerpt||n.signature));if(n.note)d.append(el('p',n.note));for(const loc of n.registrationEvidence||[])d.append(el('p',`Mounted at ${loc.file}:${loc.line}`));
if(['module','class'].includes(n.kind)){const b=el('button',expanded.has(n.id)?'Collapse contents':'Expand contents');b.onclick=()=>{expanded.has(n.id)?expanded.delete(n.id):expanded.add(n.id);$('mode').value='overview';$('search').value='';render();details(n);};d.append(b);}
for(const f of n.findings||[]){const box=el('div',undefined,'finding');box.append(el('strong',f.rule+' · '+f.level),el('p',f.message),el('small',`${f.scanner} · ${f.file}:${f.line} · ${f.status}`));d.append(box);}
for(const[title,filter]of [['Incoming',e=>e.target===n.id],['Outgoing',e=>e.source===n.id]]){d.append(el('h3',title));const matches=graph.edges.filter(filter);if(!matches.length)d.append(el('p','None resolved in this snapshot.'));for(const e of matches){const other=byId.get(e.source===n.id?e.target:e.source);if(!other)continue;const b=el('button',`${e.type} · ${other.label}${e.change==='removed'?' (baseline)':''}`,'link');b.title=`${e.confidence} · ${e.evidence.method} · ${e.evidence.file}:${e.evidence.line}`;b.onclick=()=>choose(other.id);d.append(b);}}
}
function layout(){if(cy.nodes().empty())return;cy.layout({name:headless?'grid':'cose',animate:false,randomize:false,fit:true,padding:50,nodeRepulsion:()=>140000,idealEdgeLength:()=>160,nodeOverlap:30,componentSpacing:80,numIter:500}).run();}
function render(){const q=$('search').value.trim().toLowerCase(),mode=$('mode').value;let ids;
if(q)ids=new Set(graph.nodes.filter(n=>(n.label+' '+(n.file||'')).toLowerCase().includes(q)).map(n=>n.id));
else if(mode==='impact')ids=new Set(graph.nodes.filter(n=>n.change&&n.change!=='unchanged'||n.affected).map(n=>n.id));
else if(mode==='security')ids=collect(graph.nodes.filter(n=>n.findings?.length).map(n=>n.id),'upstream',+$('hops').value);
else if(mode==='overview')ids=new Set(graph.nodes.filter(n=>n.kind==='module'||expanded.has(n.parent)).map(n=>n.id));
else ids=selected?collect([selected],mode,+$('hops').value):new Set(graph.nodes.filter(n=>n.kind==='module').map(n=>n.id));
const total=ids.size;let list=[...ids];if(selected&&ids.has(selected))list=[selected,...list.filter(id=>id!==selected)];ids=ancestors(new Set(list.slice(0,500)));
for(const n of cy.nodes())if(!n.isParent())positions.set(n.id(),n.position());
const elements=[];for(const n of graph.nodes)if(ids.has(n.id)){const parent=n.parent&&ids.has(n.parent)?n.parent:undefined;elements.push({group:'nodes',data:{...n,parent,color:colors[n.kind]||'#8794a8',hasFinding:n.findings?.length?1:0,affected:n.affected?1:0},position:positions.get(n.id)||{x:(elements.length%5)*220,y:Math.floor(elements.length/5)*110}});}
graph.edges.forEach((e,i)=>{if(e.type!=='contains'&&ids.has(e.source)&&ids.has(e.target))elements.push({group:'edges',data:{...e,id:'edge:'+i}});});
cy.elements().remove();cy.add(elements);if(!positions.size)layout();else cy.layout({name:'preset',fit:true,padding:50}).run();highlight();
$('results').replaceChildren(el('h3',q?'Search results':'Visible nodes'));for(const id of list.slice(0,100)){const n=byId.get(id);const b=el('button',n.label,'link');b.onclick=()=>choose(id);$('results').append(b);}if(!list.length)$('results').append(el('p','No matching nodes.','empty'));
$('hint').textContent=`${total>500?'Showing first 500 matches; use search to narrow. ':''}Click to inspect · Drag nodes or canvas · Scroll to zoom · Expand contents in details`;
}
cy.on('tap','node',e=>choose(e.target.id(),false));cy.on('mouseover','node, edge',e=>{const n=e.target.data();$('tooltip').textContent=n.kind?[n.label,n.file?`${n.file}:${n.line}`:'External dependency',n.framework||'',n.confidence||'',n.signature||''].filter(Boolean).join('\n'):[n.type,n.confidence,`${n.evidence.method} · ${n.evidence.file}:${n.evidence.line}`].join('\n');$('tooltip').style.display='block';});
cy.on('mousemove','node, edge',e=>{const p=e.originalEvent||{};$('tooltip').style.left=Math.max(8,Math.min((p.clientX||20)+15,innerWidth-370))+'px';$('tooltip').style.top=Math.max(8,Math.min((p.clientY||20)+15,innerHeight-170))+'px';});
cy.on('mouseout','node, edge',()=>{$('tooltip').style.display='none';});
$('search').oninput=render;$('mode').onchange=render;$('hops').onchange=render;$('fit').onclick=()=>cy.fit(undefined,50);$('layout').onclick=layout;$('plus').onclick=()=>cy.zoom(cy.zoom()*1.2);$('minus').onclick=()=>cy.zoom(cy.zoom()/1.2);
$('reset').onclick=()=>{selected=null;expanded.clear();positions.clear();$('search').value='';$('mode').value='overview';$('detail').replaceChildren(el('h2','Explore your repository'),el('p','Select a module, function or endpoint to inspect its relationships.'));render();};
render();
if(!headless&&globalThis.ResizeObserver){let resizeTimer;new ResizeObserver(()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{cy.resize();cy.fit(undefined,50);},100);}).observe($('graph'));}
</script></html>
